server {
    listen 80;
    server_name _;

    # Serve video files directly. The URL prefix is deliberately /media
    # so it does not collide with Flask's /videos pages.
    location /media/ {
        alias /videos/;
        sendfile on;
        tcp_nopush on;
        types {
            video/mp4 mp4;
            video/webm webm;
            video/ogg ogv ogg;
            video/quicktime mov;
        }
        add_header Accept-Ranges bytes;
    }

    # All website routes are handled by the Flask/Gunicorn container.
    location / {
        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
