services:
  app:
    image: chief-video-app:latest
    build:
      context: ./app
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the deployment environment}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:?Set LOGIN_PASSWORD in the deployment environment}
      VIDEO_PATH: /videos
      VIDEO_URL: /media
    volumes:
      - video-data:/videos
    expose:
      - "5000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - video-data:/videos:ro
    restart: unless-stopped

  streaming-server:
    image: airensoft/ovenmediaengine:latest
    ports:
      - "1935:1935/tcp"
      - "3333:3333/tcp"
      - "3478:3478/tcp"
      - "8080:8080/tcp"
      - "8081:8081/tcp"
      - "9000:9000/tcp"
      - "9999:9999/udp"
      - "4000-4005:4000-4005/udp"
      - "10006-10010:10006-10010/udp"
    environment:
      - OME_ORIGIN_PORT=9000
      - OME_RTMP_PROV_PORT=1935
      - OME_SRT_PROV_PORT=9999
      - OME_MPEGTS_PROV_PORT=4000-4005/udp
      - OME_HLS_STREAM_PORT=8080
      - OME_DASH_STREAM_PORT=8080
      - OME_SIGNALLING_PORT=3333
      - OME_TCP_RELAY_ADDRESS=*:3478
      - OME_ICE_CANDIDATES=*:10006-10010/udp
    command: /opt/ovenmediaengine/bin/OvenMediaEngine -c origin_conf
    restart: unless-stopped

volumes:
  video-data:
